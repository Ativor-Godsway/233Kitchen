<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>+233 Kitchen · Ghanaian food, pre-order for Wednesday pickup in Worcester, MA</title>
    <meta
      name="description"
      content="Home-cooked Ghanaian food in Worcester, MA. Pre-order loaded fried rice, banku with grilled tilapia, Hajia waakye and ice kenkey. Pick up fresh every Wednesday."
    />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="+233 Kitchen" />
    <meta property="og:title" content="+233 Kitchen · Ghana, boxed with love." />
    <meta
      property="og:description"
      content="Pre-order Ghanaian favourites and pick up fresh every Wednesday in Worcester, MA."
    />
    <meta property="og:image" content="%SITE_URL%/images/og-image.jpg" />
    <meta property="og:url" content="%SITE_URL%/" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Self-hosted fonts (src/index.css). Only the hero headline weight is preloaded. -->
    <link
      rel="preload"
      href="/fonts/ClashDisplay-Semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "+233 Kitchen",
        "description": "Ghanaian food in Worcester, MA. Pre-order online, pick up on Wednesdays.",
        "servesCuisine": ["Ghanaian", "West African"],
        "telephone": "+1-508-353-8191",
        "priceRange": "$",
        "image": "%SITE_URL%/images/og-image.jpg",
        "url": "%SITE_URL%/",
        "logo": "%SITE_URL%/images/logo-256.png",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "25 Hollywood St",
          "addressLocality": "Worcester",
          "addressRegion": "MA",
          "postalCode": "01610",
          "addressCountry": "US"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Wednesday",
            "opens": "12:00",
            "closes": "20:00"
          }
        ],
        "acceptsReservations": false,
        "hasMenu": "%SITE_URL%/#menu"
      }
    </script>
  </head>
  <body class="bg-ink text-cream antialiased">
    <div id="root"></div>
    <noscript
      >Please enable JavaScript to order from +233 Kitchen, or call (508) 353-8191.</noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
